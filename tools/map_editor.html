<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>桃园三国 · 地图小工具</title>
<style>

  #palette { width: 200px; }
  .pg { color: #ffd166; font-size: 13px; margin: 6px 0 2px; }

  .sw.sel { background: #31427a; outline: 1px solid #ffd166; }
  .sw canvas { border: 1px solid #000; background: #222; }
  #cv { border: 2px solid #4a5a88; image-rendering: pixelated; cursor: crosshair; background: #000; }
  textarea { width: 100%; height: 90px; background: #0e1526; color: #cfe; border: 1px solid #3a4a78; border-radius: 8px; font: 12px/1.4 monospace; }
  button { background: #24304f; color: #e8ecf4; border: 1px solid #3a4a78; border-radius: 8px; padding: 7px 12px; cursor: pointer; margin: 2px 2px 2px 0; }
  button.on { outline: 1px solid #ffd166; background: #31427a; }
  button:disabled { opacity: .4; cursor: default; }
  select { background: #0e1526; color: #fff; border: 1px solid #3a4a78; border-radius: 6px; padding: 6px; max-width: 260px; }
  input { width: 52px; background: #0e1526; color: #fff; border: 1px solid #3a4a78; border-radius: 6px; padding: 4px; }
  .row { margin: 8px 0; }
  .dim { color: #8a93a8; font-size: 12px; }
  #status { color: #7ee2a0; font-size: 12px; margin-left: 8px; }
  #markers div { font: 12px/1.5 monospace; }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: #8a93a8; }
  #lib { width: 300px; }
  #liblist { max-height: 66vh; overflow-y: auto; border: 1px solid #3a4a78; border-radius: 8px; padding: 4px; }
  #liblist .pg { color: #ffd166; font-size: 12px; margin: 6px 0 2px; }
  .ti { display: inline-flex; flex-direction: column; align-items: center; width: 64px; margin: 2px;
        padding: 3px 1px; border-radius: 6px; cursor: pointer; vertical-align: top; }
  .ti.sel { background: #31427a; outline: 1px solid #ffd166; }
  .ti.big { opacity: .45; cursor: not-allowed; }
  .ti canvas { border: 1px solid #000; background: #222; }
  .ti span { font-size: 10px; color: #aab3c8; word-break: break-all; text-align: center; line-height: 1.2; max-height: 24px; overflow: hidden; }
  #artsel { color: #7ee2a0; font-size: 12px; margin: 4px 0; word-break: break-all; }
</style>
</head>
<body>
<h1>桃园三国 · 地图小工具 <span class="dim">V4 贴图所见即所得 · 左键画 / 右键擦成草地 · 请用 Chrome 或 Edge 打开</span></h1>
<div id="bar">
  <button id="pickdir">① 选择游戏目录</button>
  <select id="filelist" disabled></select>
  <button id="load" disabled>② 载入</button>
  <button id="save" disabled>③ 保存回原文件</button>
  <span id="status">未连接目录</span>
</div>
<div id="wrap">
  <div id="palette"><b>图块</b><div id="pal"></div>
    <div class="row"><b>标注</b>（点图放置）<br>
      <button data-mk="npc">NPC</button><button data-mk="chest">宝箱</button><button data-mk="trans">传送</button><button data-mk="">取消标注</button>
    </div>
    <div id="markers"></div>
  </div>
  <div>
    <canvas id="cv"></canvas>
    <div class="row">宽 <input id="iw" value="20"> 高 <input id="ih" value="14">
      <button id="resize">应用尺寸（保留内容）</button>
      <button id="clear">清空为草地</button></div>
    <details><summary>高级：粘贴导入 / 导出文本（不用目录时的老办法）</summary>
      <div class="row"><b>导入</b>：粘贴现有地图 JS<br>
        <textarea id="imp"></textarea>
        <button id="doimp">解析导入</button></div>
      <div class="row"><b>导出</b><br>
        <textarea id="exp" readonly></textarea>
        <button id="doexp">生成导出</button><button id="copy">复制结果</button></div>
    </details>
  </div>
  <div id="lib"><b>素材库</b>（点选后用素材笔：左键铺 / 右键清除覆盖）
    <div id="artsel">素材笔：未使用（当前为图块笔）</div>
    <div id="liblist"></div>
  </div>
</div>

const V4_LIST = ["Buildings/Large/city_gate_4x2.png", "Buildings/Large/military_barracks_4x2.png", "Buildings/Large/palace_main_hall_4x2.png", "Buildings/Residence/Rural/rural_residence_clay_wall_b.png", "Buildings/Residence/Rural/rural_residence_thatched_roof_a.png", "Buildings/Residence/Town/town_residence_blue_roof_a.png", "Buildings/Residence/Town/town_residence_gray_roof_b.png", "Buildings/Shops/equipment_shop_armor_sign_2x2.png", "Buildings/Shops/formation_office_flag_roster_2x2.png", "Buildings/Shops/inn_lantern_sign_2x2.png", "Buildings/Shops/medicine_shop_gourd_sign_2x2.png", "Buildings/Shops/tavern_wine_jar_sign_2x2.png", "Buildings/Shops/training_hall_banner_2x2.png", "Buildings/Shops/weapon_shop_sword_sign_2x2.png", "Derived/cave_floor.png", "Derived/cave_wall.png", "Derived/deep_grass_center_flat.png", "Derived/farm_flat.png", "Derived/floor_cand_table.png", "Derived/floor_wood.png", "Derived/floor_wood_flat.png", "Derived/flower_grass_center_flat.png", "Derived/grass_alt_center_flat.png", "Derived/grass_center_flat.png", "Derived/road_corner_bottom_left.png", "Derived/road_corner_bottom_right.png", "Derived/road_cross.png", "Derived/road_edge_bottom.png", "Derived/road_edge_right.png", "Derived/road_horizontal.png", "Derived/road_junction_down.png", "Derived/road_junction_left.png", "Derived/road_junction_right.png", "Derived/road_junction_up.png", "Derived/sand_flat.png", "Derived/wall.png", "Derived/wall_cand_left_bottom.png", "Derived/wall_cand_left_top.png", "Derived/wall_cand_right_bottom.png", "Derived/wall_flat.png", "Derived/water_diaga_ne.png", "Derived/water_diaga_nw.png", "Derived/water_diaga_se.png", "Derived/water_diaga_sw.png", "Derived/water_diagb_ne.png", "Derived/water_diagb_nw.png", "Derived/water_diagb_se.png", "Derived/water_diagb_sw.png", "Derived/water_shore_e.png", "Derived/water_shore_n.png", "Derived/water_shore_s.png", "Derived/water_shore_w.png", "Props/Collectibles/flower_purple_collectible.png", "Props/Collectibles/flower_red_collectible.png", "Props/Collectibles/flower_yellow_collectible.png", "Props/Interior/imperial_dragon_throne.png", "Props/Interior/palace_lantern_gold_red.png", "Props/Interior/palace_pillar_red_gold.png", "Props/Interior/palace_pillar_white_jade.png", "Props/Interior/round_wooden_table.png", "Props/Interior/wooden_stool.png", "Props/Outdoor/barrel.png", "Props/Outdoor/battlefield_banner.png", "Props/Outdoor/campfire.png", "Props/Outdoor/haystack.png", "Props/Outdoor/rice_sack.png", "Props/Outdoor/rocks.png", "Props/Outdoor/stone_well.png", "Props/Outdoor/tombstone_stone.png", "Props/Outdoor/treasure_chest_red.png", "Props/Outdoor/wooden_crate.png", "Props/Outdoor/wooden_fence.png", "StoryEvents/burned_body_non_graphic_2x1.png", "Terrain/Base/deep_grass_center.png", "Terrain/Base/dirt_stone_mixed_center.png", "Terrain/Base/flower_grass_center.png", "Terrain/Base/grass_alt_center.png", "Terrain/Base/grass_center.png", "Terrain/Base/sand_center.png", "Terrain/Base/wasteland_dead_grass.png", "Terrain/Farm/farm_field_seedlings.png", "Terrain/Forest/bamboo_forest_center.png", "Terrain/Forest/forest_center.png", "Terrain/Interior/indoor_floor_center.png", "Terrain/Mountain/cave_entrance.png", "Terrain/Mountain/mountain_brown.png", "Terrain/Mountain/snow_mountain.png", "Terrain/Mountain/volcano_active.png", "Terrain/River/river_bend_bottom_left.png", "Terrain/River/river_bend_bottom_right.png", "Terrain/River/river_bend_top_left.png", "Terrain/River/river_bend_top_right.png", "Terrain/River/river_horizontal.png", "Terrain/River/river_vertical.png", "Terrain/Road/stone_slab_road_center.png", "Terrain/Transitions/Grass_Road/grass_road_center_blob.png", "Terrain/Transitions/Grass_Road/grass_road_corner_top_left.png", "Terrain/Transitions/Grass_Road/grass_road_corner_top_right.png", "Terrain/Transitions/Grass_Road/grass_road_edge_left.png", "Terrain/Transitions/Grass_Road/grass_road_edge_top.png", "Terrain/Transitions/Grass_Road/grass_road_vertical.png", "Terrain/Transitions/Grass_Sand/grass_sand_diagonal_a.png", "Terrain/Transitions/Grass_Sand/grass_sand_edge_bottom.png", "Terrain/Transitions/Grass_Sand/grass_sand_edge_left.png", "Terrain/Transitions/Grass_Sand/grass_sand_edge_right.png", "Terrain/Transitions/Grass_Sand/grass_sand_edge_top.png", "Terrain/Transitions/Grass_Sand/sand_patch_grass_edges_all_sides.png", "Terrain/Transitions/Grass_Water/grass_water_diagonal_a.png", "Terrain/Transitions/Grass_Water/grass_water_diagonal_b.png", "Terrain/Transitions/Grass_Water/grass_water_edge_bottom.png", "Terrain/Transitions/Grass_Water/grass_water_edge_left.png", "Terrain/Transitions/Grass_Water/grass_water_edge_right.png", "Terrain/Transitions/Grass_Water/grass_water_edge_top.png", "Terrain/Transitions/Sand_Water/sand_water_diagonal_a.png", "Terrain/Transitions/Sand_Water/sand_water_edge_bottom.png", "Terrain/Transitions/Sand_Water/sand_water_edge_left.png", "Terrain/Transitions/Sand_Water/sand_water_edge_right_river.png", "Terrain/Transitions/Sand_Water/sand_water_edge_top.png", "Terrain/Transitions/Sand_Water/sand_water_narrow_channel.png", "Terrain/Water/water_center.png"];

// ---------------- 状态 ----------------
const Z = 26;
let W = 20, H = 14, grid = [], sel = ".", markMode = "", marks = [];
let curSigns = [];
let artSel = null, artMap = {};   // 素材笔：选中的 V4 路径；美术覆盖 {"x,y": 路径}
let mapsDir = null, curHandle = null, curName = "", curText = "", dirty = false;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
const status = t => document.getElementById("status").textContent = t;

function blank() { grid = Array.from({ length: H }, () => Array(W).fill(".")); }
function tile(x, y) {
  if (y < 0 || y >= H || x < 0 || x >= W) return "#";
  return grid[y][x];
}
function mapKind() {
  const js = grid.map(r => r.join("")).join("");
  return js.indexOf("F") >= 0 ? "cave" : (js.indexOf("L") >= 0 ? "interior" : "outdoor");
}

// ---------------- 渲染（镜像 engine/map.js drawTileImage + buildingStamps） ----------------
function grassImg(x, y) {
  const h = th(x, y, 16);
  const f = h === 0 ? "flower_grass_center" : h === 1 ? "deep_grass_center"
          : h === 2 ? "grass_alt_center" : "grass_center";
  return gi("Derived/" + f + "_flat.png");
}
function inWaterBlock(x, y) {
  for (const bd of [[0,0],[-1,0],[0,-1],[-1,-1]]) {
    let all = true;
    for (const ad of [[0,0],[1,0],[0,1],[1,1]])
      if (tile(x + bd[0] + ad[0], y + bd[1] + ad[1]) !== "W") { all = false; break; }
    if (all) return true;
  }
  return false;
}
function isLake(x, y) { return tile(x, y) === "W" && inWaterBlock(x, y); }
function riverImg(x, y) {
  const at = (x, y) => {
    if (y < 0 || y >= H || x < 0 || x >= W) return true;
    const ch = tile(x, y);
    return ch === "W" || ch === "M";
  };
  const U = at(x,y-1), D = at(x,y+1), L = at(x-1,y), R = at(x+1,y);
  let f = "Water/water_center";
  if (U && D && !L && !R) f = "River/river_vertical";
  else if (L && R && !U && !D) f = "River/river_horizontal";
  else if (U && L && !D && !R) f = "River/river_bend_top_left";
  else if (U && R && !D && !L) f = "River/river_bend_top_right";
  else if (D && L && !U && !R) f = "River/river_bend_bottom_left";
  else if (D && R && !U && !L) f = "River/river_bend_bottom_right";
  else if ((U || D) && !L && !R) f = "River/river_vertical";
  else if ((L || R) && !U && !D) f = "River/river_horizontal";
  return gi("Terrain/" + f + ".png");
}
function shoreImgPaths(x, y) {
  const U = isLake(x,y-1), D = isLake(x,y+1), L = isLake(x-1,y), R = isLake(x+1,y);
  const d = "Derived/", out = [];
  const sides = (U?1:0) + (D?1:0) + (L?1:0) + (R?1:0);
  if (sides === 2 && ((U&&R)||(R&&D)||(D&&L)||(L&&U))) {
    out.push(d + "water_diagb_" + (U&&R ? "ne" : R&&D ? "se" : D&&L ? "sw" : "nw") + ".png");
  } else {
    if (U) out.push(d + "water_shore_n.png");
    if (D) out.push(d + "water_shore_s.png");
    if (L) out.push(d + "water_shore_w.png");
    if (R) out.push(d + "water_shore_e.png");
    if (sides === 0) {
      if (isLake(x+1,y-1)) out.push(d + "water_diagb_ne.png");
      if (isLake(x-1,y-1)) out.push(d + "water_diagb_nw.png");
      if (isLake(x+1,y+1)) out.push(d + "water_diagb_se.png");
      if (isLake(x-1,y+1)) out.push(d + "water_diagb_sw.png");
    }
  }
  return out;
}
function roadImg(x, y) {
  const at = (x, y) => {
    if (y < 0 || y >= H || x < 0 || x >= W) return true;
    return ",GMh".indexOf(tile(x, y)) >= 0;
  };
  const U = at(x,y-1), D = at(x,y+1), L = at(x-1,y), R = at(x+1,y);
  const n = (U?1:0) + (D?1:0) + (L?1:0) + (R?1:0);
  const GR = "Terrain/Transitions/Grass_Road/", d = "Derived/";
  let f;
  if (n >= 4) f = d + "road_cross.png";
  else if (n === 3) f = d + (!U ? "road_junction_down.png" : !D ? "road_junction_up.png"
                          : !L ? "road_junction_right.png" : "road_junction_left.png");
  else if (U && D) f = GR + "grass_road_vertical.png";
  else if (L && R) f = d + "road_horizontal.png";
  else if (U && R) f = d + "road_corner_bottom_left.png";
  else if (U && L) f = d + "road_corner_bottom_right.png";
  else if (D && R) f = GR + "grass_road_corner_top_left.png";
  else if (D && L) f = GR + "grass_road_corner_top_right.png";
  else if (U) f = d + "road_corner_bottom_left.png";
  else if (D) f = GR + "grass_road_corner_top_left.png";
  else if (L) f = GR + "grass_road_corner_top_right.png";
  else if (R) f = GR + "grass_road_corner_top_left.png";
  else f = GR + "grass_road_center_blob.png";
  return gi(f);
}
// 建筑图章（镜像 engine buildingStamps；含地图 signs 推导）
function buildingStamps() {
  const stamps = [];
  if (mapKind() !== "outdoor") return { stamps, covered: {} };
  const covered = {};
  const cov = (x, y, w, h) => {
    for (let yy = y; yy < y+h; yy++) for (let xx = x; xx < x+w; xx++) covered[xx+","+yy] = true;
  };
  const free = (x, y, w, h) => {
    for (let yy = y; yy < y+h; yy++) for (let xx = x; xx < x+w; xx++) {
      if (yy < 0 || yy >= H || xx < 0 || xx >= W) return false;
      if (covered[xx+","+yy]) return false;
      if ("BDGP".indexOf(grid[yy][xx]) < 0) return false;
    }
    return true;
  };
  const freeAny = (x, y, w, h) => {
    for (let yy = y; yy < y+h; yy++) for (let xx = x; xx < x+w; xx++) {
      if (yy < 0 || yy >= H || xx < 0 || xx >= W) return false;
      if (covered[xx+","+yy]) return false;
    }
    return true;
  };
  const push = (img, x, y, w, h) => { stamps.push({ img, x, y, w, h }); cov(x, y, w, h); };
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const ch = grid[y][x];
      if ((ch === "P" || ch === "G") && (x === 0 || grid[y][x-1] !== ch)) {
        let x1 = x;
        while (x1 + 1 < W && grid[y][x1+1] === ch) x1++;
        const img = ch === "P" ? "Buildings/Large/palace_main_hall_4x2.png"
                               : "Buildings/Large/city_gate_4x2.png";
        const cx = Math.floor((x + x1 + 1) / 2) - 2, cy = y > 0 ? y - 1 : y;
        if (freeAny(cx, cy, 4, 2)) push(img, cx, cy, 4, 2);
        x = x1;
      }
    }
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (grid[y][x] !== "D") continue;
    const sg = curSigns.find(s => SHOP_BY_SIGN[s.text] &&
      Math.abs(s.x - x) <= 2 && s.y <= y && y - s.y <= 3);
    if (!sg) continue;
    if (free(x-1, y-1, 2, 2)) push(SHOP_BY_SIGN[sg.text], x-1, y-1, 2, 2);
    else if (free(x, y-1, 2, 2)) push(SHOP_BY_SIGN[sg.text], x, y-1, 2, 2);
  }
  // 足印锚点：连通 B/D 块每栋 1 个民居（门格优先，否则最下最左）
  const anchors = {}, seen = {};
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if ((grid[y][x] !== "B" && grid[y][x] !== "D") || covered[x+","+y] || seen[x+","+y]) continue;
    const cells = [], stack = [[x, y]];
    seen[x+","+y] = true;
    while (stack.length) {
      const [cx, cy] = stack.pop();
      cells.push([cx, cy]);
      for (const [dx, dy] of [[0,-1],[0,1],[-1,0],[1,0]]) {
        const nx = cx+dx, ny = cy+dy, k = nx+","+ny;
        if (ny < 0 || ny >= H || nx < 0 || nx >= W) continue;
        if ((grid[ny][nx] !== "B" && grid[ny][nx] !== "D") || covered[k] || seen[k]) continue;
        seen[k] = true; stack.push([nx, ny]);
      }
    }
    let door = null, bl = null;
    for (const [cx, cy] of cells) {
      if (grid[cy][cx] === "D" && (!door || cy > door[1] || (cy === door[1] && cx < door[0]))) door = [cx, cy];
      if (!bl || cy > bl[1] || (cy === bl[1] && cx < bl[0])) bl = [cx, cy];
    }
    const a = door || bl;
    anchors[a[0]+","+a[1]] = true;
  }
  return { stamps, covered, anchors };
}

function drawCell(x, y, covered, anchors) {
  const ch = grid[y][x], kind = mapKind();
  const px = x * Z, py = y * Z;
  // 美术覆盖（tileArt）：整格换成指定素材，字符只管通行
  const art = artMap[x + "," + y];
  if (art) {
    const img = gi(art);
    if (img) {
      ctx.drawImage(img, px, py, Z, Z);
      ctx.fillStyle = "#ffd166";   // 覆盖标记（小黄角）
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + 7, py); ctx.lineTo(px, py + 7); ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,.15)";
      ctx.strokeRect(px + .5, py + .5, Z, Z);
      return;
    }
    // 未加载完：先按字符画，gi 的 onload 会触发重绘
  }
  const put = (img) => { if (img) ctx.drawImage(img, px, py, Z, Z); return !!img; };
  const grass = () => put(grassImg(x, y));
  const fb = (color) => { ctx.fillStyle = color || TILES[ch].color; ctx.fillRect(px, py, Z, Z); };
  const prop = () => {
    let p = PROP_IMG[ch];
    if (ch === "z") p = FLOWER_IMGS[th(x, y, 3)];
    return p ? put(gi(p)) : false;
  };
  let ok = false;
  if (kind === "interior") {
    if (ch === "B" || ch === "D" || ch === "#") { fb(ch === "B" ? "#8a6a45" : ch === "D" ? "#3a2a1a" : "#4a5060"); return; }
    ok = put(gi("Derived/floor_wood_flat.png"));
    if (ok) {
      let p = null;
      if (ch === "t") p = "Props/Interior/round_wooden_table.png";
      else if (ch === "c") p = "Props/Interior/wooden_stool.png";
      else if (ch === "X") p = th(x, y, 2) ? "Props/Interior/palace_pillar_white_jade.png"
                                           : "Props/Interior/palace_pillar_red_gold.png";
      else if (ch === "P") p = "Props/Interior/imperial_dragon_throne.png";
      if (p) ok = put(gi(p));
      else if (PROP_IMG[ch] || ch === "z") ok = prop();
    }
  } else if (kind === "cave") {
    if (ch === "F" || ch === "," || ch === "E") ok = put(gi("Derived/cave_floor.png"));
    else if (ch === "R") ok = put(gi("Terrain/Mountain/mountain_brown.png"));
    else if (ch === "C") ok = put(gi("Terrain/Mountain/cave_entrance.png"));
    else if (PROP_IMG[ch] || ch === "z") { ok = put(gi("Derived/cave_floor.png")) && prop(); }
  } else {
    if (ch === ".") ok = grass();
    else if (ch === "T") ok = put(gi("Terrain/Forest/forest_center.png"));
    else if (ch === "y") ok = put(gi("Terrain/Forest/bamboo_forest_center.png"));
    else if (ch === "i") ok = put(gi("Terrain/Mountain/snow_mountain.png"));
    else if (ch === "j") ok = put(gi("Terrain/Mountain/volcano_active.png"));
    else if (ch === "s") ok = put(gi("Derived/sand_flat.png"));
    else if (ch === "n") ok = put(gi("Derived/farm_flat.png"));
    else if (ch === ",") ok = put(roadImg(x, y));
    else if (ch === "W") ok = inWaterBlock(x, y) ? put(gi("Terrain/Water/water_center.png")) : put(riverImg(x, y));
    else if (ch === "R") ok = put(gi("Terrain/Mountain/mountain_brown.png"));
    else if (ch === "C") ok = put(gi("Terrain/Mountain/cave_entrance.png"));
    else if (ch === "#") ok = put(gi("Derived/wall_flat.png"));
    else if (ch === "M") ok = put(grassImg(x, y));
    else if (ch === "v") ok = grass() && put(gi("Props/Outdoor/stone_well.png"));
    else if (ch === "h") ok = grass() && put(gi("Buildings/Residence/Rural/rural_residence_thatched_roof_a.png"));
    else if (ch === "G") ok = put(roadImg(x, y));
    else if (PROP_IMG[ch] || ch === "z") ok = grass() && prop();
    else if (ch === "B" || ch === "D" || ch === "P") {
      ok = grass();
      if (ok && !covered[x+","+y] && anchors && anchors[x+","+y]) {
        const rural = curName.indexOf("village") >= 0;
        const rs = rural ? "Buildings/Residence/Rural/rural_residence_thatched_roof_a.png"
                         : "Buildings/Residence/Town/town_residence_blue_roof_a.png";
        ok = put(gi(rs));
        if (ok && ch === "D") { ctx.fillStyle = "#2a1f12"; ctx.fillRect(px+10, py+16, 7, 10); }
      }
    }
    // 湖岸过渡（草地系）
    if (ok && (ch === "." || ch === "v"))
      for (const p of shoreImgPaths(x, y)) put(gi(p));
  }
  if (!ok) fb();
  ctx.strokeStyle = "rgba(0,0,0,.15)";
  ctx.strokeRect(px + .5, py + .5, Z, Z);
}
function drawMarks() {
  for (const m of marks) {
    const c = m.type === "npc" ? "#4f8cff" : m.type === "chest" ? "#e8c84a" : "#ff6a5a";
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(m.x * Z + Z - 8, m.y * Z + 8, 6, 0, 7); ctx.fill();
    ctx.fillStyle = "#000";
    ctx.font = "bold 9px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(m.type === "npc" ? "N" : m.type === "chest" ? "宝" : "传", m.x * Z + Z - 8, m.y * Z + 11);
  }
}
function draw() {
  cv.width = W * Z; cv.height = H * Z;
  const { stamps, covered, anchors } = buildingStamps();
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) drawCell(x, y, covered, anchors);
  // 建筑图章（盖在地形之上）
  for (const st of stamps) {
    const img = gi(st.img);
    if (img) ctx.drawImage(img, st.x * Z, st.y * Z, st.w * Z, st.h * Z);
  }
  // 未被图章覆盖的招牌文字
  for (const sg of curSigns) {
    const sup = stamps.some(s => sg.x >= s.x-1 && sg.x <= s.x+s.w && sg.y >= s.y-1 && sg.y <= s.y+s.h);
    if (sup || sg.x >= W || sg.y >= H) continue;
    ctx.fillStyle = sg.color || "#ffd166";
    ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(sg.text, sg.x * Z + Z/2, sg.y * Z + Z/2);
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  }
  drawMarks();
}

function buildLib(list) {
  const el = document.getElementById("liblist");
  el.innerHTML = "";
  const groups = {};
  for (const p of list) {
    const g = p.split("/").slice(0, -1).join("/") || "(根)";

  }
  for (const g of Object.keys(groups).sort()) {

      d.className = "ti";

      g2.imageSmoothingEnabled = false;

      im.onload = () => {
        g2.drawImage(im, 0, 0, 40, 40);
        if (im.naturalWidth !== 32 || im.naturalHeight !== 32) d.classList.add("big");
      };

      nm.textContent = p.split("/").pop().replace(".png", "");

          "素材笔：" + (artSel || "未使用（当前为图块笔）");

  }
}

// ---------------- 解析：grid + 标注 + 招牌 ----------------
function parseMapText(text) {
  const gridM = text.match(/grid:\s*\[([\s\S]*?)\]/);
  if (!gridM) return null;
  const rows = [...gridM[1].matchAll(/"([^"]*)"/g)].map(m => m[1])
    .filter(r => r.length && [...r].every(c => TILES[c]));
  if (!rows.length) return null;
  const nameM = text.match(/name:\s*"([^"]+)"/);
  return { rows, name: nameM ? nameM[1] : "" };
}
function parseMarks(text) {
  const out = [];
  for (const m of text.matchAll(/\{\s*id:\s*"([^"]+)",\s*x:\s*(\d+),\s*y:\s*(\d+)/g))
    out.push({ type: "npc", x: +m[2], y: +m[3], note: m[1] });
  for (const m of text.matchAll(/\{\s*x:\s*(\d+),\s*y:\s*(\d+),\s*id:\s*"([^"]+)"/g))
    out.push({ type: "chest", x: +m[1], y: +m[2], note: m[3] });
  for (const line of text.split("\n")) {
    if (!line.includes("to:")) continue;
    const sm = line.match(/\{\s*x:\s*(\d+),\s*y:\s*(\d+)/);
    if (sm) out.push({ type: "trans", x: +sm[1], y: +sm[2], note: "" });
  }
  return out;
}
function parseSigns(text) {
  const out = [];
  for (const m of text.matchAll(/\{\s*x:\s*(\d+),\s*y:\s*(\d+),\s*text:\s*"([^"]+)"(?:,\s*color:\s*"([^"]+)")?/g))
    out.push({ x: +m[1], y: +m[2], text: m[3], color: m[4] });
  return out;
}
function parseTileArt(text) {
  const m = text.match(/tileArt:\s*\{([\s\S]*?)\}/);
  const out = {};
  if (m) for (const e of m[1].matchAll(/"(\d+,\d+)":\s*"([^"]+)"/g)) out[e[1]] = e[2];
  return out;
}
function loadParsed(p, text) {
  H = p.rows.length; W = p.rows[0].length;
  grid = p.rows.map(r => [...r]);
  marks = parseMarks(text);
  curSigns = parseSigns(text);
  artMap = parseTileArt(text);
  document.getElementById("iw").value = W;
  document.getElementById("ih").value = H;
  dirty = false; listMarks(); draw();
}

// 保存：只替换原文件的 grid / tileArt / chests / transitions 块，其他内容（NPC/触发器/台词等）原样保留
// chests/transitions 按坐标合并：文件里同坐标的条目原文保留（物品/gold/目标不丢），新标注补默认条目；
// 没有对应标注时不重写该块（防止误清空）。NPC 标注仅显示用，不写回。
function splitEntries(blockText) {   // 按花括号配对拆出顶层 {...} 条目（兼容 items/to 嵌套）
  const out = [];
  let depth = 0, start = -1;
  for (let i = 0; i < blockText.length; i++) {
    const c = blockText[i];
    if (c === "{") { if (depth === 0) start = i; depth++; }
    else if (c === "}") {
      depth--;
      if (depth === 0 && start >= 0) { out.push(blockText.slice(start, i + 1)); start = -1; }
    }
  }
  return out;
}
function mergeBlock(text, field, marks2, makeNew) {
  if (!marks2.length) return text;   // 无标注：保持文件原样
  const re = new RegExp(field + ":\\s*\\[([\\s\\S]*?)\\n  \\]");   // 块结束锚定到 "\n  ]"（防止 face: [0,-1] 的 ] 截断）
  const m = text.match(re);
  const old = {};
  if (m) for (const e of splitEntries(m[1])) {
    const cm = e.match(/x:\s*(\d+),\s*y:\s*(\d+)/);
    if (cm && !old[cm[1] + "," + cm[2]]) old[cm[1] + "," + cm[2]] = e;
  }
  const entries = marks2.map(mk => old[mk.x + "," + mk.y] || makeNew(mk));
  const block = field + ": [\n" + entries.map(e => "    " + e + ",").join("\n") + "\n  ]";
  if (m) return text.replace(re, block);
  return text.replace(/(grid:\s*\[[\s\S]*?\](?:\s*,\s*tileArt:\s*\{[\s\S]*?\})?)/, "$1,\n  " + block);
}
document.getElementById("save").onclick = async () => {

  const widths = new Set(grid.map(r => r.length));

  const nChest = marks.filter(m => m.type === "chest").length;
  const nTrans = marks.filter(m => m.type === "trans").length;
  if (!confirm("写回 " + curName + "：grid + tileArt" +
    (nChest ? " + 宝箱×" + nChest : "") + (nTrans ? " + 传送×" + nTrans : "") +
    "\n（同坐标旧条目原文保留；NPC 标注不写回）")) return;
  try {
    const gridText = "grid: [\n" + grid.map(r => "    \"" + r.join("") + "\",").join("\n") + "\n  ]";
    let newText = curText.replace(/grid:\s*\[[\s\S]*?\]/, gridText);
    if (newText === curText) { alert("替换失败：没找到 grid 块"); return; }
    // tileArt：先删旧块，有内容再插到 grid 后面

    const keys = Object.keys(artMap).sort((a, b) => {
      const [ax, ay] = a.split(",").map(Number), [bx, by] = b.split(",").map(Number);
      return ay - by || ax - bx;

    if (keys.length) {
      const taText = ",\n  tileArt: {\n" +
        keys.map(k => "    \"" + k + "\": \"" + artMap[k] + "\",").join("\n") + "\n  }";
      newText = newText.replace(/(grid:\s*\[[\s\S]*?\])/, "$1" + taText);
    }
    // 宝箱 / 传送：按坐标合并写回
    let cid = 1;
    const usedIds = new Set();
    newText = mergeBlock(newText, "chests", marks.filter(m => m.type === "chest"),
      mk => { while (usedIds.has("c" + cid)) cid++; const id = "c" + cid; usedIds.add(id);
              return "{ x: " + mk.x + ", y: " + mk.y + ", id: \"" + id + "\", gold: 100 }"; });
    newText = mergeBlock(newText, "transitions", marks.filter(m => m.type === "trans"),
      mk => "{ x: " + mk.x + ", y: " + mk.y + ", to: { map: \"目标图\", x: 0, y: 0 } }");
    const w = await curHandle.createWritable();
    await w.write(newText);
    await w.close();
    curText = newText; dirty = false;
    status("已保存 " + curName + " ✔（素材覆盖 " + keys.length + " 格）");
  } catch (e) { alert("保存失败：" + e.message); }
};
// ---------------- 老办法：粘贴导入 / 导出 ----------------
document.getElementById("doimp").onclick = () => {
  const p = parseMapText(document.getElementById("imp").value);
  if (!p) { alert("没认出地图行"); return; }
  curHandle = null; curName = "";
  loadParsed(p, document.getElementById("imp").value);
};
document.getElementById("doexp").onclick = () => {
  let s = "grid: [\n" + grid.map(r => "    \"" + r.join("") + "\",").join("\n") + "\n  ],";
  const npc = marks.filter(m => m.type === "npc")
    .map(m => "    { id: \"n" + m.x + "_" + m.y + "\", x: " + m.x + ", y: " + m.y +
      ", color: \"#4f8cff\", name: \"村民\", lines: [\"台词。\"] },");
  const ch = marks.filter(m => m.type === "chest")
    .map((m, i) => "    { x: " + m.x + ", y: " + m.y + ", id: \"c" + (i + 1) + "\", gold: 100 },");
  const tr = marks.filter(m => m.type === "trans")
    .map(m => "    { x: " + m.x + ", y: " + m.y + ", to: { map: \"目标图\", x: 0, y: 0 } },");
  if (npc.length) s += "\n  npcs: [\n" + npc.join("\n") + "\n  ],";
  if (ch.length) s += "\n  chests: [\n" + ch.join("\n") + "\n  ],";
  if (tr.length) s += "\n  transitions: [\n" + tr.join("\n") + "\n  ],";
  const taKeys = Object.keys(artMap).sort((a, b) => {
    const [ax, ay] = a.split(",").map(Number), [bx, by] = b.split(",").map(Number);
    return ay - by || ax - bx;
  });
  if (taKeys.length) s += "\n  tileArt: {\n" +
    taKeys.map(k => "    \"" + k + "\": \"" + artMap[k] + "\",").join("\n") + "\n  },";
  document.getElementById("exp").value = s;
};
document.getElementById("copy").onclick = async () => {
  await navigator.clipboard.writeText(document.getElementById("exp").value);
  alert("已复制");
};
blank(); listMarks(); draw();
</script>
