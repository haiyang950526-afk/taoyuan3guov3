<script>
window.__errs = [];
window.onerror = (m, s, l) => { window.__errs.push(m + " @" + s + ":" + l); };
window.addEventListener("load", () => {
  setTimeout(() => {
    try {
      const q = (location.hash || "#ch00_city").slice(1).split(",");
      newGame();
      hide("scr-title");
      if (q[0] !== "ch00_city" || q.length > 1) warpTo(q[0], +(q[1]||5), +(q[2]||5));
      S.warpLock = false;
      // 预热：把渲染本图需要的全部图片实例化，确保截图前加载完
      const c0 = cam();
      for (let y = 0; y < mapDef().grid.length; y++) for (let x = 0; x < mapDef().grid[0].length; x++) {
        drawTileImage(tileAt(x, y), -9999, -9999, x, y);
      }
      buildingStamps().forEach(st => gfxImg(V4 + st.img));
      gfxImg(V4 + "Props/Outdoor/treasure_chest_red.png");
    } catch (e) { window.__errs.push("boot: " + e.message); }
    setTimeout(() => {
      document.title = window.__errs.length ? ("ERR: " + window.__errs.join(" | ")) : "OK";
      const d = document.createElement("pre");
      d.id = "result"; d.textContent = document.title;
      document.body.appendChild(d);
    }, 3000);
  }, 100);
});
</script>
